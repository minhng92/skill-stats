# No [build-system]: Hermes loads the plugin from its folder (relative imports
# only), so this file is metadata for tooling/tests, not a build spec.
[project]
name = "hermes-skill-stats"
version = "0.9.1"
description = "Per-skill usage counters for Hermes Agent (session + global stats)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kyzlab" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/NousResearch/hermes-official-plugins"
